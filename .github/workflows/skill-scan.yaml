name: Skill scan

on:
  pull_request:
    paths: ["samples/**"]
  push:
    branches: [main]
    paths: ["samples/**"]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install SkillSpector (pinned)
        run: uv tool install git+https://github.com/NVIDIA/skillspector.git@v2.12.0

      - name: Scan skills
        run: bash scripts/scan-skills.sh samples/*/

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skillspector-reports
          path: reports/
